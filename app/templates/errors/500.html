{% extends "base.html" %}
{% block title %}Server Error – 500{% endblock %}
{% block content %}
<section class="section-gap text-center py-5">
  <div class="container">
    <div class="error-page" data-aos="zoom-in">
      <div class="error-page__code text-danger">500</div>
      <h2 class="error-page__title">Something Went Wrong</h2>
      <p class="error-page__text text-muted">
        We're sorry, an internal server error occurred. Please try again later.
      </p>
      <a href="{{ url_for('main.index') }}" class="btn btn-accent btn-lg mt-3">
        <i class="bi bi-house me-2"></i>Return Home
      </a>
    </div>
  </div>
</section>
{% endblock %}
