{% extends "base.html" %}
{% block title %}Page Not Found – 404{% endblock %}
{% block content %}
<section class="section-gap text-center py-5">
  <div class="container">
    <div class="error-page" data-aos="zoom-in">
      <div class="error-page__code">404</div>
      <h2 class="error-page__title">Oops! Page Not Found</h2>
      <p class="error-page__text text-muted">
        The page you're looking for doesn't exist or has been moved.
      </p>
      <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
        <a href="{{ url_for('main.index') }}" class="btn btn-accent btn-lg">
          <i class="bi bi-house me-2"></i>Go Home
        </a>
        <a href="{{ url_for('products.catalogue') }}" class="btn btn-outline-primary btn-lg">
          Browse Products
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
